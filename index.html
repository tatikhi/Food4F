<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('cb_theme') || 'sunlit';
                document.documentElement.setAttribute('data-theme', savedTheme);
            } catch(e) {}
        })();
    </script>

    <title>Food4F</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root, [data-theme="sunlit"] {
            --bg-main: #FFF5F0; --surface: #FFFFFF; --text-primary: #331B14; --text-secondary: #704C42;
            --accent-main: #E87A5D; --accent-light: #FDE6DD; --border-color: #F7CBBF;
            --shadow-soft: 0 2px 8px rgba(232, 122, 93, 0.08); --icon-inactive: #C7A69C; --ios-blue: #007AFF;
        }
        [data-theme="berry"] {
            --bg-main: #1D161E; --surface: #2A202C; --text-primary: #F7EBF0; --text-secondary: #B39DA8;
            --accent-main: #D96B94; --accent-light: #3D2938; --border-color: #4A3545;
            --shadow-soft: 0 2px 8px rgba(0, 0, 0, 0.2); --icon-inactive: #6B5263; --ios-blue: #0A84FF;
        }
        [data-theme="icederm"] {
            --bg-main: #F0F6FA; --surface: #FFFFFF; --text-primary: #122836; --text-secondary: #425F73;
            --accent-main: #2B78A3; --accent-light: #DCECF5; --border-color: #B9D5E6;
            --shadow-soft: 0 2px 8px rgba(43, 120, 163, 0.08); --icon-inactive: #90AEC2; --ios-blue: #007AFF;
        }
        [data-theme="midnight"] {
            --bg-main: #0F141C; --surface: #161D2B; --text-primary: #F0F5FF; --text-secondary: #8E9EB8;
            --accent-main: #4E9EFF; --accent-light: #1A2E4A; --border-color: #23324A;
            --shadow-soft: 0 2px 8px rgba(0, 0, 0, 0.3); --icon-inactive: #4B5E7D; --ios-blue: #0A84FF;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-main); color: var(--text-primary);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            padding: 20px 14px 40px; font-size: 16px;
        }

        body.theme-animated * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }

        input, select {
            -webkit-user-select: text !important; user-select: text !important;
            caret-color: var(--accent-main);
            width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-color); 
            background: var(--surface); color: var(--text-primary); font-size: 16px !important; outline: none;
            -webkit-appearance: none; appearance: none;
        }

        .svg-icon {
            display: inline-block; width: 20px; height: 20px;
            stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .brand-font, .modal-title { font-family: 'Alice', Georgia, serif; font-weight: 400; }
        
        .header-bar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .logo { font-family: 'Alice', Georgia, serif; font-size: 1.6rem; text-transform: uppercase; letter-spacing: 0.05em; }

        .btn-settings-round {
            width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border-color);
            color: var(--text-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-soft);
        }

        .main-card { background: var(--surface); border-radius: 16px; width: 100%; max-width: 480px; padding: 18px 16px; border: 1px solid var(--border-color); }
        
        .segmented-switch { position: relative; display: flex; background: var(--bg-main); border-radius: 14px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .segmented-pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--surface); border-radius: 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); z-index: 1; }
        .segmented-switch[data-state="right"] .segmented-pill { transform: translate3d(100%, 0, 0); }
        .segmented-btn { position: relative; z-index: 2; flex: 1; padding: 10px 8px; text-align: center; border-radius: 10px; cursor: pointer; color: var(--text-secondary); border: none; background: transparent; font-weight: 600; font-size: 1rem; transition: color 0.25s; }
        .segmented-btn.active { color: var(--text-primary); }

        /* СТРОКА ПОИСКА */
        .search-bar-wrapper { position: relative; margin-bottom: 16px; width: 100%; }
        .search-bar-wrapper input { padding-left: 40px; border-radius: 10px; background: var(--bg-main); border: 1px solid var(--border-color); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--icon-inactive); width: 18px; height: 18px; }

        /* СПИСКИ ТОВАРОВ */
        .category-title { font-family: 'Alice', serif; font-size: 1.15rem; color: var(--text-primary); margin: 16px 0 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        
        .routine-item { background: var(--surface); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 10px; cursor: pointer; transition: 0.2s; }
        .routine-item:active { background: var(--bg-main); }
        .routine-item-vertical { flex-direction: column; align-items: stretch; cursor: default; }
        .routine-item-vertical:active { background: var(--surface); }
        
        .item-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .item-name { font-size: 1rem; font-weight: 600; color: var(--text-primary); word-break: break-word; line-height: 1.2; }
        .item-note { font-size: 0.8125rem; color: var(--text-secondary); font-weight: 500; }

        /* ТОЧКИ СТАТУСА НА ПОЛКЕ (Красный слева, Желтый по центру, Зеленый справа) */
        .status-controls { display: flex; gap: 8px; align-items: center; }
        .dot-btn { width: 24px; height: 24px; border-radius: 50%; background-color: var(--icon-inactive); opacity: 0.25; cursor: pointer; transition: 0.2s; border: none; display: flex; align-items: center; justify-content: center; color: transparent; }
        .dot-btn.active { opacity: 1; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px currentColor; }
        
        .dot-red { background-color: rgb(205, 52, 52); color: rgb(205, 52, 52); }
        .dot-orange { background-color: rgb(215, 135, 30); color: rgb(215, 135, 30); }
        .dot-green { background-color: rgb(47, 139, 88); color: rgb(47, 139, 88); }

        /* КНОПКА ГАЛОЧКИ ДЛЯ ПОКУПОК (Пустой кружок) */
        .btn-check-done { 
            background: transparent; border: 2px solid var(--icon-inactive); 
            width: 30px; height: 30px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; flex-shrink: 0; color: var(--icon-inactive);
            transition: 0.2s;
        }
        .btn-check-done:active { opacity: 0.6; background: var(--bg-main); }
        .btn-check-done svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.5; fill: none; }

        /* МАГАЗИНЫ И ССЫЛКИ */
        .store-links { margin-top: 12px; }
        .store-btn-primary { 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--ios-blue); color: #FFF; width: 100%; padding: 10px; 
            border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.95rem;
            margin-bottom: 8px; transition: 0.2s;
        }
        .store-btn-primary:active { opacity: 0.8; }
        .store-btn-primary svg { width: 18px; height: 18px; }
        
        .secondary-stores { display: flex; gap: 6px; flex-wrap: wrap; }
        .store-btn-secondary { 
            background: var(--bg-main); color: var(--text-secondary); font-size: 0.8rem; 
            padding: 6px 10px; border-radius: 8px; text-decoration: none; font-weight: 600; 
            border: 1px solid var(--border-color);
        }
        
        .btn-add { width: 100%; padding: 14px; border-radius: 12px; border: 1px dashed var(--accent-main); background: var(--accent-light); color: var(--accent-main); font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 12px; }

        /* ИНТЕРФЕЙС НАСТРОЕК */
        .inset-list-group { margin-bottom: 20px; width: 100%; }
        .inset-list { background: var(--surface); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; }
        .inset-list-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border-color); font-size: 1rem; color: var(--text-primary); cursor: pointer; transition: background 0.2s ease; }
        .inset-list-item:last-child { border-bottom: none; }
        .inset-list-item:active { background: var(--bg-main); }
        .inset-list-item.center-action { justify-content: center; color: var(--ios-blue); font-weight: 600; }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: none; justify-content: center; align-items: flex-end; z-index: 1000; opacity: 0; transition: opacity 0.25s ease; }
        .modal-overlay.active-modal { opacity: 1; }
        
        /* Исправлен transition, чтобы реагировал только на transform (убирает дергание при появлении клавиатуры) */
        .modal-card { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; max-height: 85%; display: flex; flex-direction: column; padding: 0 16px 24px; position: relative; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--border-color); border-bottom: none; }
        .modal-overlay.active-modal .modal-card { transform: translateY(0); }
        
        .modal-drag-handle { width: 100%; padding: 12px 0; display: flex; justify-content: center; cursor: grab; flex-shrink: 0; }
        .modal-drag-handle::before { content: ''; width: 38px; height: 5px; background: var(--border-color); border-radius: 3px; }
        
        .modal-header-nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
        .modal-nav-btn { background: transparent; border: none; color: var(--accent-main); font-size: 1.05rem; font-weight: 600; cursor: pointer; }
        .modal-nav-title { font-size: 1.2rem; font-weight: 600; color: var(--text-primary); }

        .modal-body-scrollable { overflow-y: auto; padding-bottom: 20px; }

        /* НАСТРОЙКИ (ТЕМЫ) */
        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .theme-card-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 12px; background: var(--bg-main); border: 1px solid var(--border-color); cursor: pointer; }
        .theme-card-btn.active { border-color: var(--accent-main); background: var(--accent-light); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .theme-preview-box { width: 100%; height: 28px; border-radius: 8px; display: flex; overflow: hidden; border: 1px solid rgba(128, 128, 128, 0.3); }
        .theme-preview-bg { flex: 2; }
        .theme-preview-accent { flex: 1; }
        .theme-card-title { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }

        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: var(--surface); border: 1px solid var(--accent-main); color: var(--text-primary); padding: 14px 20px; border-radius: 16px; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.25s ease; z-index: 10000; text-align: center; }
        .toast.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="logo">Food4F</div>
        <button type="button" class="btn-settings-round" id="btnOpenSettings">
            <svg class="svg-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l-.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09A1.65 1.65 0 0 0 19.4 15z"></path>
            </svg>
        </button>
    </div>

    <div class="main-card">
        <div class="segmented-switch" id="tabSwitch" data-state="left">
            <div class="segmented-pill" id="tabPill"></div>
            <button type="button" class="segmented-btn active" id="btnTabShelves">Куплено</button>
            <button type="button" class="segmented-btn" id="btnTabShopping">Купить</button>
        </div>

        <div class="search-bar-wrapper" id="searchWrapper">
            <svg class="svg-icon search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Поиск в запасах...">
        </div>

        <div id="contentContainer"></div>
        
        <button class="btn-add" id="btnAddItem" style="display: none;">+ Добавить новый товар</button>
    </div>

    <!-- Модальное окно Редактирования/Создания -->
    <div class="modal-overlay" id="formModal">
        <div class="modal-card">
            <div class="modal-drag-handle"></div>
            <div class="modal-header-nav">
                <button class="modal-nav-btn" id="btnCancelForm">Отмена</button>
                <div class="modal-nav-title brand-font" id="formTitle">Товар</div>
                <button class="modal-nav-btn" id="btnSaveForm">Сохранить</button>
            </div>
            <div class="modal-body-scrollable">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="inpName" placeholder="">
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="inpCat"></select>
                </div>
                <div class="form-group">
                    <label>Основной магазин</label>
                    <select id="inpStore">
                        <option value="none">Не выбран</option>
                        <option value="ozon">Ozon Fresh</option>
                        <option value="market">Яндекс Маркет</option>
                        <option value="lavka">Я.Лавка (через Маркет)</option>
                        <option value="vkusvill">ВкусВилл</option>
                        <option value="samokat">Самокат</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Заметка / Бренд</label>
                    <input type="text" id="inpNote" placeholder="">
                </div>
                <button class="btn-add" id="btnDeleteForm" style="color: #C0392B; border-color: #C0392B; background: rgba(192,57,43,0.1); margin-top: 20px;">Удалить товар</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно Настроек -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-drag-handle"></div>
            <div class="modal-header-nav">
                <div></div>
                <div class="modal-nav-title brand-font">Настройки</div>
                <button class="modal-nav-btn" id="btnCloseSettings">Готово</button>
            </div>
            <div class="modal-body-scrollable">
                
                <!-- Новая настройка сортировки -->
                <div class="form-group" style="margin-bottom: 24px;">
                    <label>Сортировка товаров (внутри категории)</label>
                    <select id="inpSortPref">
                        <option value="date">По дате добавления</option>
                        <option value="alpha">По алфавиту</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Тема оформления</label>
                    <div class="theme-grid" id="themeRow">
                        <button class="theme-card-btn" data-theme="sunlit"><div class="theme-preview-box"><div class="theme-preview-bg" style="background: #FFF5F0;"></div><div class="theme-preview-accent" style="background: #E87A5D;"></div></div><span class="theme-card-title">Sunlit</span></button>
                        <button class="theme-card-btn" data-theme="berry"><div class="theme-preview-box"><div class="theme-preview-bg" style="background: #1D161E;"></div><div class="theme-preview-accent" style="background: #D96B94;"></div></div><span class="theme-card-title">Berry</span></button>
                        <button class="theme-card-btn" data-theme="icederm"><div class="theme-preview-box"><div class="theme-preview-bg" style="background: #F0F6FA;"></div><div class="theme-preview-accent" style="background: #2B78A3;"></div></div><span class="theme-card-title">Ice Dream</span></button>
                        <button class="theme-card-btn" data-theme="midnight"><div class="theme-preview-box"><div class="theme-preview-bg" style="background: #0F141C;"></div><div class="theme-preview-accent" style="background: #4E9EFF;"></div></div><span class="theme-card-title">Midnight</span></button>
                    </div>
                </div>
                
                <div class="inset-list-group" style="margin-top: 24px;">
                    <div class="inset-list">
                        <div class="inset-list-item center-action" id="btnForceUpdate">
                            Обновить приложение
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 4 основные категории
        const CATEGORIES = ["Холодильник", "Морозилка", "Кухня", "NonFood"];

        const STORES = {

        const initialProducts = [

            {n: "Макаронные изделия", note: "из твёрдых сортов: вермишель, фигурные"}, {n: "Мука"}, {n: "Листы для лазаньи"}, {n: "Рис"}, {n: "Крупа гречневая"}, {n: "Чечевица красная"}, {n: "Овсяные хлопья"}, {n: "Сахар тростниковый"},
            {n: "Соус для макарон / томатный"}, {n: "Бургер-соус"}, {n: "Соус десертный (шоколадный)"}, {n: "Зажарка для супа", note: "с морковью и луком"}, {n: "Смеси приправ для плова"}, {n: "Бумага для жарки филе"},
            {n: "Кофе в дрип-пакетах"}, {n: "Сгущённое молоко", note: "с бананом"}, {n: "Мороженое", note: "пломбир в вафельном стаканчике"}, {n: "Желе порционное (низкокалорийное)"}, {n: "Желатин пищевой"}, {n: "Ванильный сахар"},
            {n: "Бумажные полотенца"}, {n: "Губки для посуды"}, {n: "Пергамент / бумага для выпечки"}, {n: "Сменные кассеты / фильтры для воды"}, {n: "Стиральный порошок"}, {n: "Глазные капли Стиллавит"}
        ].map((p, i) => ({ id: i+1, name: p.n, cat: "Холодильник", note: p.note || '', status: 'ok', store: 'none' }));

        let items = [];
        let currentTab = 'shelves';
        let searchQuery = '';
        let sortPref = localStorage.getItem('cb_sort') || 'date';

        const STORE_KEYS = { items: 'stock_items_v4' }; 

        const safeStorage = {
            get(key) { try { return localStorage.getItem(key); } catch(e) { return null; } },
            set(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
        };

        const tgCloud = {
            set(key, val) { return new Promise(resolve => { if (tg.CloudStorage) tg.CloudStorage.setItem(key, val, () => resolve()); else resolve(); }); },
            get(key) { return new Promise(resolve => { if (tg.CloudStorage) tg.CloudStorage.getItem(key, (err, val) => resolve(val || null)); else resolve(null); }); }
        };

        async function saveToCloudChunked(key, dataObj) {
            const jsonStr = JSON.stringify(dataObj);
            const chunks = jsonStr.match(/.{1,3900}/g) || [];
            await tgCloud.set(key + '_count', chunks.length.toString());
            for (let i = 0; i < chunks.length; i++) {
                await tgCloud.set(key + '_' + i, chunks[i]);
            }
        }

        async function loadFromCloudChunked(key) {
            const countStr = await tgCloud.get(key + '_count');
            if (!countStr) return null;
            const count = parseInt(countStr, 10);
            let fullStr = '';
            for (let i = 0; i < count; i++) {
                const chunk = await tgCloud.get(key + '_' + i);
                if (chunk) fullStr += chunk;
            }
            try { return JSON.parse(fullStr); } catch(e) { return null; }
        }

        function saveApp() {
            safeStorage.set(STORE_KEYS.items, JSON.stringify(items));
            if (tg.CloudStorage) {
                saveToCloudChunked('cloud_items_v4', items);
            }
        }

        async function initApp() {
            populateCatSelect();
            const localItems = safeStorage.get(STORE_KEYS.items);
            if (localItems) { items = JSON.parse(localItems); } else { items = initialProducts; saveApp(); }
            
            // Настраиваем переключатель сортировки
            document.getElementById('inpSortPref').value = sortPref;
            document.getElementById('inpSortPref').onchange = (e) => {
                sortPref = e.target.value;
                localStorage.setItem('cb_sort', sortPref);
                render();
            };

            render();

            if (tg.CloudStorage) {
                const cloudItems = await loadFromCloudChunked('cloud_items_v4');
                if (cloudItems && cloudItems.length > 0) {
                    items = cloudItems;
                    render();
                }
                safeStorage.set(STORE_KEYS.items, JSON.stringify(items));
            }
        }

        function sortItemsList(list) {
            return list.sort((a, b) => {
                if (sortPref === 'alpha') {
                    return a.name.localeCompare(b.name, 'ru');
                } else {
                    return a.id - b.id; // Чем меньше ID (timestamp), тем старше товар
                }
            });
        }

        function render() {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';
            if (currentTab === 'shelves') {
                document.getElementById('searchWrapper').style.display = 'block';
                document.getElementById('btnAddItem').style.display = 'block';
                renderShelves(container);
            } else {
                document.getElementById('searchWrapper').style.display = 'none';
                document.getElementById('btnAddItem').style.display = 'none';
                searchQuery = '';
                document.getElementById('searchInput').value = '';
                renderShopping(container);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderShelves(document.getElementById('contentContainer'));
        });

        function renderShelves(container) {
            container.innerHTML = ''; 
            
            let filteredItems = searchQuery 
                ? items.filter(i => i.name.toLowerCase().includes(searchQuery) || (i.note && i.note.toLowerCase().includes(searchQuery)))
                : [...items];

            if (filteredItems.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted); font-weight: 500;">Ничего не найдено</div>`;
                return;
            }

            const allCats = Array.from(new Set([...CATEGORIES, ...filteredItems.map(i => i.cat)]));
            
            allCats.forEach(cat => {
                let catItems = filteredItems.filter(i => i.cat === cat);
                if (catItems.length === 0) return;
                
                catItems = sortItemsList(catItems);

                let html = `<div class="category-title">${cat}</div>`;
                catItems.forEach(item => {
                    html += `
                    <div class="routine-item" onclick="openForm(${item.id})">
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
                        </div>
                        <div class="status-controls" onclick="event.stopPropagation()">
                            <button class="dot-btn dot-red ${item.status==='empty'?'active':''}" onclick="setStatus(${item.id}, 'empty')"></button>
                            <button class="dot-btn dot-orange ${item.status==='soon'?'active':''}" onclick="setStatus(${item.id}, 'soon')"></button>
                            <button class="dot-btn dot-green ${item.status==='ok'?'active':''}" onclick="setStatus(${item.id}, 'ok')"></button>
                        </div>
                    </div>`;
                });
                container.innerHTML += html;
            });
        }

        function renderShopping(container) {
            const urgencies = [
                { id: 'empty', label: 'Закончилось', color: 'var(--red, #CD3434)' },
                { id: 'soon', label: 'Заканчивается', color: 'var(--orange, #D7871E)' }
            ];
            
            urgencies.forEach(urg => {
                let list = items.filter(i => i.status === urg.id);
                if (list.length === 0) return;
                
                list = sortItemsList(list);

                const svgAlert = `<svg class="svg-icon" style="width: 14px; height: 14px; margin-right: 4px; color: ${urg.color}"><circle cx="12" cy="12" r="10" fill="currentColor"></circle></svg>`;
                let html = `<div class="category-title">${svgAlert} ${urg.label}</div>`;
                
                list.forEach(item => {
                    const query = encodeURIComponent(item.name + (item.note ? ' ' + item.note : ''));
                    
                    let linksHtml = '';
                    if (item.store && STORES[item.store]) {
                        const st = STORES[item.store];
                        linksHtml += `<a href="${st.url}${query}" class="store-btn-primary" target="_blank"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg> ${st.label}</a>`;
                        
                        linksHtml += `<div class="secondary-stores">`;
                        for (let key in STORES) {
                            if (key !== item.store) {
                                linksHtml += `<a href="${STORES[key].url}${query}" class="store-btn-secondary" target="_blank">${STORES[key].label}</a>`;
                            }
                        }
                        linksHtml += `</div>`;
                    } else {
                        linksHtml += `<div class="secondary-stores">`;
                        for (let key in STORES) {
                            linksHtml += `<a href="${STORES[key].url}${query}" class="store-btn-secondary" target="_blank">${STORES[key].label}</a>`;
                        }
                        linksHtml += `</div>`;
                    }

                    html += `
                    <div class="routine-item routine-item-vertical">
                        <div class="item-header">
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
                            </div>
                            <button class="btn-check-done" onclick="setStatus(${item.id}, 'ok')">
                                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </button>
                        </div>
                        <div class="store-links">${linksHtml}</div>
                    </div>`;
                });
                container.innerHTML += html;
            });

            if(items.filter(i => i.status !== 'ok').length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted); font-weight: 500;">Сейчас всё куплено</div>`;
            }
        }

        function setStatus(id, newStatus) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.status = newStatus;
                saveApp(); 
                render();
            }
        }

        function populateCatSelect() {
            const sel = document.getElementById('inpCat');
            sel.innerHTML = '';
            CATEGORIES.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
        }

        function openForm(id = null) {
            const modal = document.getElementById('formModal');
            if (id) {
                const item = items.find(i => i.id === id);
                document.getElementById('formTitle').innerText = "Редактировать";
                document.getElementById('editId').value = item.id;
                document.getElementById('inpName').value = item.name;
                
                const sel = document.getElementById('inpCat');
                if (!CATEGORIES.includes(item.cat)) {
                    let exists = Array.from(sel.options).some(opt => opt.value === item.cat);
                    if (!exists) sel.innerHTML += `<option value="${item.cat}">${item.cat}</option>`;
                }
                
                document.getElementById('inpCat').value = item.cat;
                document.getElementById('inpStore').value = item.store || 'none';
                document.getElementById('inpNote').value = item.note || '';
                document.getElementById('btnDeleteForm').style.display = 'block';
            } else {
                document.getElementById('formTitle').innerText = "Новый товар";
                document.getElementById('editId').value = '';
                document.getElementById('inpName').value = '';
                document.getElementById('inpNote').value = '';
                document.getElementById('inpStore').value = 'none';
                document.getElementById('inpCat').value = CATEGORIES[0];
                document.getElementById('btnDeleteForm').style.display = 'none';
            }
            openModal(modal);
        }

        document.getElementById('btnSaveForm').onclick = () => {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('inpName').value.trim();
            const cat = document.getElementById('inpCat').value;
            const note = document.getElementById('inpNote').value.trim();
            const store = document.getElementById('inpStore').value;

            if (!name) return showToast("Введите название");

            if (id) {
                const item = items.find(i => i.id == id);
                item.name = name; item.cat = cat; item.note = note; item.store = store;
            } else {
                items.push({ id: Date.now(), name, cat, note, store, status: 'ok' });
            }
            saveApp(); render(); closeModal(document.getElementById('formModal'));
        };

        document.getElementById('btnDeleteForm').onclick = () => {
            const id = document.getElementById('editId').value;
            items = items.filter(i => i.id != id);
            saveApp(); render(); closeModal(document.getElementById('formModal'));
        };

        // --- Закрытие окон по тапу вне формы (на затемненный фон) ---
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    closeModal(overlay);
                }
            });
        });

        // --- Вкладки (Switch) ---
        document.getElementById('btnTabShelves').onclick = () => {
            currentTab = 'shelves';
            document.getElementById('tabSwitch').setAttribute('data-state', 'left');
            document.getElementById('btnTabShelves').classList.add('active');
            document.getElementById('btnTabShopping').classList.remove('active');
            render();
        };
        document.getElementById('btnTabShopping').onclick = () => {
            currentTab = 'shopping';
            document.getElementById('tabSwitch').setAttribute('data-state', 'right');
            document.getElementById('btnTabShopping').classList.add('active');
            document.getElementById('btnTabShelves').classList.remove('active');
            render();
        };

        // --- Настройки, Темы и Модалки ---
        document.getElementById('themeRow').onclick = (e) => {
            const btn = e.target.closest('.theme-card-btn');
            if (btn) {
                const theme = btn.dataset.theme;
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('cb_theme', theme);
                document.body.classList.add('theme-animated');
            }
        };

        function openModal(el) { el.style.display = 'flex'; requestAnimationFrame(() => el.classList.add('active-modal')); }
        function closeModal(el) { el.classList.remove('active-modal'); setTimeout(() => el.style.display = 'none', 300); }

        document.getElementById('btnOpenSettings').onclick = () => openModal(document.getElementById('settingsModal'));
        document.getElementById('btnCloseSettings').onclick = () => closeModal(document.getElementById('settingsModal'));
        document.getElementById('btnCancelForm').onclick = () => closeModal(document.getElementById('formModal'));
        document.getElementById('btnAddItem').onclick = () => openForm(null);

        // Обновление приложения (жесткая перезагрузка)
        document.getElementById('btnForceUpdate').onclick = () => {
            showToast('Обновление...');
            setTimeout(() => {
                window.location.replace(window.location.pathname + "?v=" + Date.now());
            }, 300);
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2500);
        }

        initApp();
    </script>
</body>
</html>
